name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --------------------------------------------------------------------------
  # clang-format: enforce formatting on all library headers and sources
  # --------------------------------------------------------------------------
  format:
    name: clang-format
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format-14
        run: sudo apt-get update && sudo apt-get install -y clang-format-14

      - name: Check formatting (all library sources)
        run: |
          find include/titaninfer src -name '*.hpp' -o -name '*.cpp' \
            | xargs clang-format-14 --dry-run --Werror

  # --------------------------------------------------------------------------
  # cppcheck: static analysis across all library headers and sources
  # --------------------------------------------------------------------------
  static-analysis:
    name: cppcheck
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --error-exitcode=1 \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --std=c++20 \
            --inline-suppr \
            include/titaninfer/ \
            src/
