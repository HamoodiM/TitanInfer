name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --------------------------------------------------------------------------
  # Linux: build and test entirely inside Docker (GCC 11, Ubuntu 22.04).
  # The Dockerfile builder stage runs cmake + make + ctest as RUN layers.
  # Any test failure exits the RUN layer non-zero → docker build fails.
  # --------------------------------------------------------------------------
  docker-build-and-test:
    runs-on: ubuntu-22.04
    name: Docker (GCC 11, Ubuntu 22.04)

    steps:
      - uses: actions/checkout@v4

      - name: Build image and run tests
        run: docker build --target builder -t titaninfer:ci .

  # --------------------------------------------------------------------------
  # Windows: native MSVC build (Docker-on-Windows is not portable in GHA).
  # --------------------------------------------------------------------------
  windows-msvc:
    runs-on: windows-latest
    name: Windows (MSVC 2022)

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: cd build && ctest --output-on-failure -C Release
